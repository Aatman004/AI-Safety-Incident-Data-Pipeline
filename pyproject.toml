[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-safety-incident-pipeline"
version = "0.1.0"
description = "Automated data ingestion and threat intelligence pipeline tracking global AI safety research and incidents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aatman Gupta", email = "aatmangupta8@gmail.com" }
]
keywords = [
    "ai-safety",
    "ai-alignment",
    "incident-database",
    "threat-intelligence",
    "data-pipeline"
]
dependencies = [
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
incident-pipeline = "incident_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
